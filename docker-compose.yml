# Production-shaped local stack. Not required for dev (SQLite + in-memory queue work standalone).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: uvicorn nexus.main:app --host 0.0.0.0 --port 8000
    environment:
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus@db:5432/nexus
      NEXUS_QUEUE_BACKEND: redis
      NEXUS_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: python -m nexus.workers.worker
    environment:
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus@db:5432/nexus
      NEXUS_QUEUE_BACKEND: redis
      NEXUS_REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
