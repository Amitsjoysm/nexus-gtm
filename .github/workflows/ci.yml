name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- Quality gate: lint ----------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip }
      - run: pip install ruff
      - name: ruff (F + E9 — real bugs, not style noise)
        run: ruff check nexus tests

  # ---------- Quality gate: types (frontend) ----------
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  # ---------- Quality gate: tests + coverage threshold ----------
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip }
      # `metrics` is required, not optional: /metrics is on by default since M15, and
      # test_incident_hardening asserts ordinary endpoints still work with instrumentation
      # ACTIVE. Without the instrumentator installed, `_maybe_enable_metrics` degrades to
      # "no metrics", /metrics 404s, and the test fails — for the one reason it is not
      # meant to catch.
      - run: pip install -e ".[dev,migrate,metrics]"
      - name: pytest (parallel, bounded) + coverage gate
        # Coverage floor starts conservative; ratchet it up as the suite grows.
        run: >
          pytest -n auto -p no:cacheprovider --timeout=120 -q
          --cov=nexus --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-xml, path: coverage.xml }

  # ---------- Integration: C-1 (Postgres advisory lock + FOR UPDATE) & H-4 (Redis idempotency) ----
  integration-postgres:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nexus, POSTGRES_PASSWORD: nexus, POSTGRES_DB: nexus }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip }
      - run: pip install -e ".[dev,postgres,redis]"
      - name: Integration tests (real Postgres + Redis)
        env:
          NEXUS_TEST_POSTGRES_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
          NEXUS_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest tests_integration -p no:cacheprovider --timeout=120 -q

  # ---------- Quality gate: frontend build ----------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ---------- Quality gate: secret scanning ----------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Advisory: dependency vulnerabilities (visible, non-blocking) ----------
  deps-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # surfaces advisories without blocking; promote to a gate when clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install pip-audit && pip-audit -r <(pip install -e . >/dev/null 2>&1; pip freeze) || true
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm audit --audit-level=high || true

  # ---------- Quality gate: image builds + container scan ----------
  image:
    name: Image build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: nexus-gtm:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        # Run the scanner's own image rather than `aquasecurity/trivy-action`.
        #
        # Two failures came from the action, not from the scan. The unprefixed `0.24.0` it was
        # pinned to stopped resolving ("unable to find version") because upstream publishes only
        # v-prefixed tags; on a valid tag, the action's `setup-trivy` step then shallow-clones the
        # trivy repo and runs contrib/install.sh, which exits 1 immediately after resolving the
        # version. Neither failure had anything to do with this repo's image.
        #
        # The official image needs no installer and pins exactly what runs. The build above uses
        # `load: true`, so the image is in the local daemon and the mounted socket is what lets
        # the scanner see it.
        #
        # None of this was visible before: the job needs `test` to pass, and `test` was red for
        # months, so this step was SKIPPED and the image was never scanned at all.
        # `.trivyignore.yaml` holds dated, justified exceptions — currently only the starlette
        # CVEs that the fastapi<0.116 pin blocks. Each entry expires, so the gate re-reddens
        # instead of quietly accepting them forever.
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ runner.temp }}/trivy-cache:/root/.cache/trivy
          -v ${{ github.workspace }}/.trivyignore.yaml:/work/.trivyignore.yaml:ro
          aquasec/trivy:0.65.0 image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /work/.trivyignore.yaml
          --no-progress
          nexus-gtm:ci-${{ github.sha }}

  # ---------- Single required status check for branch protection ----------
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, integration-postgres, frontend, secrets, image]
    steps:
      - run: echo "All required quality gates passed."
