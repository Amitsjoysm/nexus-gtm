name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- Quality gate: lint ----------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip }
      - run: pip install ruff
      - name: ruff (F + E9 — real bugs, not style noise)
        run: ruff check nexus tests

  # ---------- Quality gate: types (frontend) ----------
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  # ---------- Quality gate: tests + coverage threshold ----------
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip }
      - run: pip install -e ".[dev,migrate]"
      - name: pytest (parallel, bounded) + coverage gate
        # Coverage floor starts conservative; ratchet it up as the suite grows.
        run: >
          pytest -n auto -p no:cacheprovider --timeout=120 -q
          --cov=nexus --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-xml, path: coverage.xml }

  # ---------- Quality gate: frontend build ----------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ---------- Quality gate: secret scanning ----------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Advisory: dependency vulnerabilities (visible, non-blocking) ----------
  deps-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # surfaces advisories without blocking; promote to a gate when clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install pip-audit && pip-audit -r <(pip install -e . >/dev/null 2>&1; pip freeze) || true
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm audit --audit-level=high || true

  # ---------- Quality gate: image builds + container scan ----------
  image:
    name: Image build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: nexus-gtm:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: nexus-gtm:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------- Single required status check for branch protection ----------
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend, secrets, image]
    steps:
      - run: echo "All required quality gates passed."
