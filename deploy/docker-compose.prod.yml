# NEXUS GTM — single-VM production stack.
#
#   caddy (TLS, $DOMAIN) -> app (FastAPI + SPA, 2 workers)
#                            \-> worker (queue consumer + automation heartbeat)
#   postgres (data)   valkey (task queue / cache, Redis-protocol)
#
# Everything is driven by ./.env (see .env.production.example). Run via ./deploy.sh.

name: nexus-gtm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Queue durability across restarts: append-only file on a volume.
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    image: nexus-gtm:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # The API serves as the least-privilege, RLS-enforced role (the user-facing surface).
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus_app:${NEXUS_APP_DB_PASSWORD}@postgres:5432/nexus
      # Owner connection — used only by the entrypoint for migrations + role/RLS provisioning.
      NEXUS_DB_OWNER_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      NEXUS_APP_DB_PASSWORD: ${NEXUS_APP_DB_PASSWORD}
      NEXUS_REDIS_URL: redis://valkey:6379/0
      NEXUS_QUEUE_BACKEND: redis
      # The app container migrates the DB to head + provisions the role/RLS on start (as owner);
      # the worker does neither (to avoid a race) and connects as the owner for cross-tenant sweeps.
      NEXUS_RUN_MIGRATIONS: "1"
      # Real signals only in production: never fabricate demo funding/hiring events for live
      # tenants. Redundant with the env-based fail-safe in config (NEXUS_ENV=prod), kept explicit.
      NEXUS_DEMO_SIGNALS_ENABLED: "false"
      # /metrics aggregates both uvicorn workers. Without this each worker keeps its own registry
      # and a scrape reports roughly half the traffic, flapping between the two. The entrypoint
      # empties the directory on start (stale per-process files are never reclaimed). Set on the
      # app only — the worker is single-process and this variable would blank its registry.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      # In-memory: these files are per-container-run and must not survive a restart.
      - /tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # M27: two replicas so a restart is a rolling one. Measured on a genuine `compose up` with a
    # single replica: 1x502 even with health checks and Caddy retry, because there was no second
    # instance to serve while the first was down. `deploy.replicas` is honoured by `docker compose
    # up --scale` and by Swarm; the Caddyfile already load-balances across resolved instances.
    #
    # NOTE: `docker compose` restarts replicas together by default. The staggered restart is in
    # `deploy/rollout.sh`, which stops and starts them one at a time and waits for health in
    # between — that ordering is the whole point, and a plain `compose restart` does not do it.
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
      rollback_config:
        parallelism: 1
        order: start-first
    healthcheck:
      # /ready, not /health: readiness gates on the database being reachable, so a replica that is
      # up but cannot serve is never rotated into the load balancer.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    image: nexus-gtm:latest
    restart: unless-stopped
    command: ["python", "-m", "nexus.workers.worker"]
    env_file: .env
    environment:
      # The worker runs trusted cross-tenant sweeps (find due accounts/cadences across all
      # tenants), so it connects as the owner; its per-tenant processing is TenantSession-scoped.
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      NEXUS_REDIS_URL: redis://valkey:6379/0
      NEXUS_QUEUE_BACKEND: redis
      # The worker runs the automation heartbeat (which ingests signals) — keep demo signals off.
      NEXUS_DEMO_SIGNALS_ENABLED: "false"
      # The worker serves no HTTP, so it exports its own registry here: job outcomes plus the
      # state gauges (queue depth, dead letters, dunning depth). Reachable only on the compose
      # network — deliberately not published to the host.
      NEXUS_WORKER_METRICS_PORT: "9100"
    expose:
      - "9100"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Wait for the app to finish migrations + role/RLS provisioning before consuming jobs.
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  caddydata:
  caddyconfig:
