# Alertmanager routing for NEXUS GTM alerts.
#
# Ships with an INERT default receiver so Alertmanager starts cleanly out of the box (alerts fire
# and group, but are not delivered anywhere). Before onboarding real users, wire a real receiver —
# uncomment the slack_configs block below and set SLACK_WEBHOOK_URL — so an outage is never silent.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h   # page more often for criticals

receivers:
  # Inert by default (no *_configs = valid receiver that delivers nothing). Replace with the
  # Slack block below (or a pagerduty_configs / webhook_configs) to actually notify.
  - name: default
    # slack_configs:
