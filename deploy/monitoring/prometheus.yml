# Prometheus scrape + alerting config for the NEXUS GTM stack.
# The app exposes /metrics only when NEXUS_METRICS_ENABLED=true (prometheus-fastapi-instrumentator).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Deliver firing alerts to Alertmanager (which routes to Slack/PagerDuty/etc.). Alertmanager is
# optional in the overlay — if it isn't running, rules still evaluate; they just aren't delivered.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nexus-app
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: nexus-app }

  # Self-scrape so Prometheus's own health is visible on the dashboard.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
