# Reusable deploy steps for ONE Container Apps environment (staging or production).
#
# WHY A TEMPLATE RATHER THAN TWO COPIES.
#
# Staging's only job is to be a faithful rehearsal of production. Two hand-maintained copies of
# these steps diverge — and the first thing to diverge is never the cosmetic part. It is the
# ordering rule below: app before worker, because deploy/entrypoint.sh runs `alembic upgrade head`
# and scripts/apply_rls.py on the APP ONLY (NEXUS_RUN_MIGRATIONS=1). A staging copy that rolls the
# worker first would pass, prove nothing about the production sequence, and leave the one race
# this pipeline exists to prevent completely untested.
#
# So both stages call this file. Divergence becomes a parameter you can see, not a drift you cannot.
#
# OUTPUT VARIABLES ARE A CONTRACT WITH THE PRODUCTION ROLLBACK STAGE (azure-pipelines-cd.yml).
# It reads recordPrev.prevImage / recordPrev.prevRevision (what to restore) and updateApp.newImage /
# updateApp.deployStarted (whether production was touched at all) by STEP NAME. Rename a step or a
# variable here without changing that stage and nothing errors — the rollback just never runs.

parameters:
  - name: envName # display only — appears in step names so the log says which estate was touched
    type: string
  - name: azureSubscription # ADO service connection (workload identity federation)
    type: string
  - name: resourceGroup
    type: string
  - name: appName
    type: string
  - name: workerName
    type: string
  - name: appUrl # https://... — the smoke test target
    type: string
  - name: acrName
    type: string
  - name: imageRepo
    type: string
  - name: imageSha # the CI-built, Trivy-scanned commit SHA. NEVER "latest".
    type: string

steps:
  # ---------------------------------------------------------------------------------------------
  # Capture the rollback target BEFORE changing anything. After the update it is gone from
  # `properties.latestRevisionName`, and a rollback with no recorded target is a guess.
  #
  # OUTPUT variables (isOutput=true), because the consumer is a later STAGE: a plain setvariable
  # dies with this job. Recorded here, in a step that finishes before anything is changed, the value
  # is trustworthy even when a later step fails — that is what makes it a safe rollback target.
  # ---------------------------------------------------------------------------------------------
  - task: AzureCLI@2
    name: recordPrev
    displayName: "[${{ parameters.envName }}] Record current revision (rollback target)"
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        PREV_IMAGE=$(az containerapp show \
          --name "${{ parameters.appName }}" --resource-group "${{ parameters.resourceGroup }}" \
          --query "properties.template.containers[0].image" -o tsv)
        PREV_REV=$(az containerapp show \
          --name "${{ parameters.appName }}" --resource-group "${{ parameters.resourceGroup }}" \
          --query "properties.latestReadyRevisionName" -o tsv)
        echo "Rollback target: revision=${PREV_REV} image=${PREV_IMAGE}"
        if [ -z "${PREV_IMAGE}" ] || [ "${PREV_IMAGE}" = "None" ]; then
          echo "##[warning]Could not read the running image. If this deploy fails, a rollback has to reconstruct the target from revision history."
        fi
        echo "##vso[task.setvariable variable=prevImage;isOutput=true]${PREV_IMAGE}"
        echo "##vso[task.setvariable variable=prevRevision;isOutput=true]${PREV_REV}"

  # ---------------------------------------------------------------------------------------------
  # APP FIRST — it runs the migrations. See the header.
  # ---------------------------------------------------------------------------------------------
  - task: AzureCLI@2
    name: updateApp
    displayName: "[${{ parameters.envName }}] Update app (runs migrations + RLS on boot)"
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        IMAGE="${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepo }}:${{ parameters.imageSha }}"
        echo "Deploying ${IMAGE} to ${{ parameters.appName }}"
        # FROM HERE ON THE ESTATE MAY BE CHANGED, so the marker goes out BEFORE the update, not after:
        # an update that errors or times out may still have been accepted by ARM, so "the call
        # failed" does not mean "nothing changed". Everything that can fail earlier — a rejected
        # approval (no step runs at all), recording the rollback target — leaves the marker unset,
        # and the production Rollback stage does nothing without it.
        echo "##vso[task.setvariable variable=newImage;isOutput=true]${IMAGE}"
        echo "##vso[task.setvariable variable=deployStarted;isOutput=true]true"
        az containerapp update \
          --name "${{ parameters.appName }}" --resource-group "${{ parameters.resourceGroup }}" \
          --image "${IMAGE}" \
          --output none
        az containerapp revision list \
          --name "${{ parameters.appName }}" --resource-group "${{ parameters.resourceGroup }}" \
          --query "[?properties.active].{rev:name,healthy:properties.healthState,running:properties.runningState}" \
          -o table

  # ---------------------------------------------------------------------------------------------
  # Wait for THE NEW REVISION to be healthy before touching the worker, or the worker starts
  # against a half-migrated schema.
  #
  # "Some revision is ready" is not the question. In Single revision mode the old revision keeps
  # serving until the new one is healthy, so it always answers yes: on 2026-11-06 v1.13.0's
  # revision was killed mid-boot on every attempt, this step passed in seconds on the 21 October
  # revision, the worker was moved to the new image, and staging validation passed against the old
  # code. So the step names the revision it is waiting for (the latest, which must carry this
  # image) and passes only when that one is the latest READY revision and reports Healthy.
  # ---------------------------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: "[${{ parameters.envName }}] Wait for the new app revision to become healthy"
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        APP="${{ parameters.appName }}"
        RG="${{ parameters.resourceGroup }}"
        IMAGE="${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepo }}:${{ parameters.imageSha }}"
        LATEST=""
        for i in $(seq 1 60); do
          LATEST=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "")
          READY=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || echo "")
          REV_IMAGE=""; HEALTH=""; STATE=""
          if [ -n "$LATEST" ]; then
            REV_IMAGE=$(az containerapp revision show --name "$APP" --resource-group "$RG" \
              --revision "$LATEST" --query "properties.template.containers[0].image" -o tsv \
              2>/dev/null || echo "")
            HEALTH=$(az containerapp revision show --name "$APP" --resource-group "$RG" \
              --revision "$LATEST" --query "properties.healthState" -o tsv 2>/dev/null || echo "")
            STATE=$(az containerapp revision show --name "$APP" --resource-group "$RG" \
              --revision "$LATEST" --query "properties.runningState" -o tsv 2>/dev/null || echo "")
          fi
          echo "[$i/60] latest=${LATEST} (${STATE}, ${HEALTH}) ready=${READY} image=${REV_IMAGE}"
          if [ "$REV_IMAGE" = "$IMAGE" ] && [ "$READY" = "$LATEST" ] && [ "$HEALTH" = "Healthy" ]; then
            echo "Revision ${LATEST} runs ${IMAGE} and is healthy."
            exit 0
          fi
          sleep 10
        done
        echo "##[error]The new revision (${LATEST:-none}) did not become healthy with ${IMAGE} within 10 minutes. The previous revision is still the one serving."
        if [ -n "$LATEST" ]; then
          timeout 60 az containerapp logs show --name "$APP" --resource-group "$RG" \
            --revision "$LATEST" --tail 100 --format text || true
        fi
        timeout 60 az containerapp logs show --name "$APP" --resource-group "$RG" \
          --type system --tail 50 --format text || true
        exit 1

  # ---------------------------------------------------------------------------------------------
  # WORKER SECOND — same image, no migrations.
  # ---------------------------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: "[${{ parameters.envName }}] Update worker"
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        IMAGE="${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepo }}:${{ parameters.imageSha }}"
        az containerapp update \
          --name "${{ parameters.workerName }}" --resource-group "${{ parameters.resourceGroup }}" \
          --image "${IMAGE}" \
          --output none
        echo "Worker updated to ${IMAGE}"

  # ---------------------------------------------------------------------------------------------
  # THE GATE. /ready, not /health — readiness includes database reachability, so a replica that is
  # up but cannot serve is never called good.
  # ---------------------------------------------------------------------------------------------
  - bash: |
      set -euo pipefail
      for p in /health /ready; do
        code=$(curl -s -o /dev/null -w '%{http_code}' \
          --max-time 10 --retry 6 --retry-delay 5 --retry-all-errors \
          "${{ parameters.appUrl }}${p}")
        echo "GET ${p} -> ${code}"
        if [ "$code" != "200" ]; then
          echo "##[error]Smoke test failed on ${p} (HTTP ${code})"
          exit 1
        fi
      done
      echo "Smoke test passed — ${{ parameters.envName }} is live and healthy."
    displayName: "[${{ parameters.envName }}] Post-deploy smoke test (gates the release)"
