# NEXUS GTM — CD to Azure Container Apps.
#
# Triggered by a version tag (vX.Y.Z). Infrastructure is Terraform (deploy/cloud/azure) and is
# applied separately; this pipeline only ships a new image to Container Apps that already exist.
#
# FOUR RULES THAT ARE NOT STYLISTIC:
#
#  1. DEPLOY THE TESTED ARTIFACT. This pipeline never builds. CI already built and Trivy-scanned
#     `<repo>:<sha>` on ACR; a rebuild here would produce a different image (new base-image
#     layers, new transitive wheels) than the one that passed the gates. So CD RESOLVES the tag
#     to its commit SHA and REFUSES TO DEPLOY if that image is not in the registry.
#
#  2. STAGING BEFORE PRODUCTION, AND THE SAME SHA IN BOTH. The identical image digest is deployed
#     to staging, validated, and only then promoted. Nothing is rebuilt in between — promotion is
#     literally the same `az containerapp update --image` against a different resource group.
#
#  3. APP BEFORE WORKER, ALWAYS. deploy/entrypoint.sh runs `alembic upgrade head` +
#     scripts/apply_rls.py on the APP ONLY (NEXUS_RUN_MIGRATIONS=1); the worker deliberately
#     does neither, to avoid a migration race. Roll the worker first and it consumes jobs
#     against a stale schema. The Terraform encodes this with depends_on; so does the shared
#     step template both environments use.
#
#  4. THE SMOKE TEST GATES THE RELEASE, and it hits /ready — not /health. Readiness gates on the
#     database being reachable, so a replica that is up but cannot serve is never called good.
#
# Rollback is a revision pin, captured BEFORE the update. See the Rollback stage.

name: $(Build.SourceBranchName)-$(Rev:r)

trigger:
  tags:
    include: ["v*"]
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Pipeline variables (Pipelines > Edit > Variables), or an ADO variable group:
  #
  #   AZURE_SUBSCRIPTION          workload-identity-federation service connection name
  #   ACR_NAME                    e.g. nexusgtmprodacr1a2b3c4d  (SHARED by both environments)
  #
  #   RESOURCE_GROUP              nexus-prod-rg
  #   APP_NAME                    nexus-prod-app
  #   WORKER_NAME                 nexus-prod-worker
  #   APP_URL                     https://gtm.infojoy.com
  #
  #   STAGING_RESOURCE_GROUP      nexus-staging-rg
  #   STAGING_APP_NAME            nexus-staging-app
  #   STAGING_WORKER_NAME         nexus-staging-worker
  #   STAGING_APP_URL             https://<staging ACA ingress FQDN>
  #
  # ONE REGISTRY, TWO ENVIRONMENTS, ON PURPOSE. Rule 2 above requires production to run the exact
  # image staging validated. Two registries would mean copying the image between them, and a copy
  # is a new artifact — at which point "the same image was tested" becomes an assumption instead
  # of a fact the `Verify` stage can check.
  - name: IMAGE_REPO
    value: nexus-gtm

stages:
  # ============================================================================
  # Stage 1 — Verify the artifact exists. Cheap, and it turns "deployed nothing"
  # into a clear failure instead of a confusing ACA error ten minutes later.
  # ============================================================================
  - stage: Verify
    displayName: Verify tested image exists
    jobs:
      - job: verify
        displayName: Resolve tag to SHA and confirm image
        timeoutInMinutes: 10
        steps:
          - checkout: self
            fetchDepth: 0 # need the tag's commit

          - bash: |
              set -euo pipefail
              SHA="$(git rev-list -n 1 HEAD)"
              echo "Tag $(Build.SourceBranchName) -> commit ${SHA}"
              echo "##vso[task.setvariable variable=imageSha;isOutput=true]${SHA}"
            name: resolve
            displayName: Resolve tag to commit SHA

          - task: AzureCLI@2
            displayName: Confirm the CI-built, Trivy-scanned image is in ACR
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                SHA="$(resolve.imageSha)"
                if ! az acr repository show-tags \
                      --name "$(ACR_NAME)" --repository "$(IMAGE_REPO)" \
                      --output tsv | grep -qx "${SHA}"; then
                  echo "##[error]No image $(IMAGE_REPO):${SHA} in $(ACR_NAME)."
                  echo "##[error]CI must build and scan this commit on master before it can be tagged and released."
                  echo "##[error]Refusing to build here: a deploy-time build ships an image nothing has scanned."
                  exit 1
                fi
                echo "Found $(IMAGE_REPO):${SHA} — this is the image CI tested."

  # ============================================================================
  # Stage 2 — STAGING. No approval: staging is where the artifact earns the right
  # to be offered to production, so a human gate here would only add latency to a
  # decision nobody can make without the result.
  # ============================================================================
  - stage: DeployStaging
    displayName: Deploy to staging
    dependsOn: Verify
    condition: succeeded()
    variables:
      imageSha: $[ stageDependencies.Verify.verify.outputs['resolve.imageSha'] ]
    jobs:
      - deployment: deploy_staging
        displayName: Roll out app, then worker (staging)
        environment: staging # no required approvers — see the stage comment
        timeoutInMinutes: 45
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/pipelines/deploy-containerapp.yml
                  parameters:
                    envName: staging
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    resourceGroup: $(STAGING_RESOURCE_GROUP)
                    appName: $(STAGING_APP_NAME)
                    workerName: $(STAGING_WORKER_NAME)
                    appUrl: $(STAGING_APP_URL)
                    acrName: $(ACR_NAME)
                    imageRepo: $(IMAGE_REPO)
                    imageSha: $(imageSha)

  # ============================================================================
  # Stage 3 — Validate staging. THE QUALITY GATE. Production is unreachable
  # unless every assertion here passes; each corresponds to a failure this
  # deployment has actually had (docs/deployment/10-ISSUE-LOG.md).
  # ============================================================================
  - stage: ValidateStaging
    displayName: Staging validation gate
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - job: validate
        displayName: Assert staging is genuinely usable
        timeoutInMinutes: 20
        steps:
          - checkout: self
          - template: deploy/pipelines/staging-validation.yml
            parameters:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              resourceGroup: $(STAGING_RESOURCE_GROUP)
              appName: $(STAGING_APP_NAME)
              workerName: $(STAGING_WORKER_NAME)
              appUrl: $(STAGING_APP_URL)

  # ============================================================================
  # Stage 4 — PRODUCTION. `environment: production` is the manual approval gate;
  # configure required approvers in ADO under Pipelines > Environments.
  #
  # dependsOn ValidateStaging, NOT DeployStaging: deploying to staging is not the
  # gate, PASSING there is. Depending on the deploy stage would let a broken
  # artifact reach the approval prompt, where the reviewer has no evidence and
  # the natural action is to approve.
  # ============================================================================
  - stage: DeployProduction
    displayName: Deploy to production
    dependsOn: [Verify, ValidateStaging]
    condition: succeeded()
    variables:
      imageSha: $[ stageDependencies.Verify.verify.outputs['resolve.imageSha'] ]
    jobs:
      - deployment: deploy_production
        displayName: Roll out app, then worker (production)
        environment: production # <-- add required approvers here
        timeoutInMinutes: 45
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/pipelines/deploy-containerapp.yml
                  parameters:
                    envName: production
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    resourceGroup: $(RESOURCE_GROUP)
                    appName: $(APP_NAME)
                    workerName: $(WORKER_NAME)
                    appUrl: $(APP_URL)
                    acrName: $(ACR_NAME)
                    imageRepo: $(IMAGE_REPO)
                    imageSha: $(imageSha)

                - bash: |
                    echo "Deployed $(Build.SourceBranchName) ($(imageSha)) to production."
                    echo "This is the same image digest validated in staging."
                  displayName: Record deployment outcome
                  condition: always()

  # ============================================================================
  # Stage 5 — Automatic rollback if the PRODUCTION deploy failed.
  #
  # Container Apps is in Single revision mode (see deploy/cloud/azure/container_apps.tf), so
  # rollback is a redeploy of the previous IMAGE rather than an instant traffic shift. That is
  # a real limitation and it is why this stage exists rather than a one-line traffic weight.
  #
  # Deliberately NOT wired to a staging failure: a broken staging deploy has harmed nothing, and
  # rolling it back would destroy the evidence needed to diagnose why the artifact was bad.
  # ============================================================================
  - stage: Rollback
    displayName: Rollback production on failure
    dependsOn: DeployProduction
    condition: failed()
    jobs:
      - job: rollback
        displayName: Restore previous image
        timeoutInMinutes: 30
        steps:
          - task: AzureCLI@2
            displayName: Roll app and worker back
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Read the last known-good image straight from the platform rather than trusting
                # a variable from a stage that failed partway through.
                PREV=$(az containerapp revision list \
                  --name "$(APP_NAME)" --resource-group "$(RESOURCE_GROUP)" \
                  --query "sort_by([?properties.healthState=='Healthy'], &properties.createdTime)[-2].properties.template.containers[0].image" \
                  -o tsv)
                if [ -z "${PREV}" ] || [ "${PREV}" = "None" ]; then
                  echo "##[error]No previous healthy revision found. MANUAL INTERVENTION REQUIRED."
                  echo "##[error]Inspect: az containerapp revision list -n $(APP_NAME) -g $(RESOURCE_GROUP) -o table"
                  exit 1
                fi
                echo "Rolling back to ${PREV}"
                az containerapp update -n "$(APP_NAME)"    -g "$(RESOURCE_GROUP)" --image "${PREV}" --output none
                az containerapp update -n "$(WORKER_NAME)" -g "$(RESOURCE_GROUP)" --image "${PREV}" --output none
                echo "##[warning]Rolled back to ${PREV}. The failed release was NOT deployed."
                echo "##[warning]NOTE: a rollback does NOT revert database migrations. Migrations in"
                echo "##[warning]this repo are additive-only (see CLAUDE.md), so the previous image"
                echo "##[warning]runs correctly against the newer schema — but verify before assuming."
