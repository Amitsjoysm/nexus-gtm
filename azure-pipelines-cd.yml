# NEXUS GTM — CD to Azure Container Apps.
#
# Triggered by a version tag (vX.Y.Z). Infrastructure is Terraform (deploy/cloud/azure) and is
# applied separately; this pipeline only ships a new image to Container Apps that already exist.
#
# FOUR RULES THAT ARE NOT STYLISTIC:
#
#  1. DEPLOY THE TESTED ARTIFACT. This pipeline never builds. CI already built and Trivy-scanned
#     `<repo>:<sha>` on ACR; a rebuild here would produce a different image (new base-image
#     layers, new transitive wheels) than the one that passed the gates. So CD RESOLVES the tag
#     to its commit SHA and REFUSES TO DEPLOY if that image is not in the registry. CI creates
#     the `<sha>` tag only AFTER Trivy passes (azure-pipelines-ci.yml, Package stage), so its
#     existence is the evidence, and CI tests on production's Python and dependency pins.
#
#  2. STAGING BEFORE PRODUCTION, AND THE SAME SHA IN BOTH. The identical image digest is deployed
#     to staging, validated, and only then promoted. Nothing is rebuilt in between — promotion is
#     literally the same `az containerapp update --image` against a different resource group.
#
#  3. APP BEFORE WORKER, ALWAYS. deploy/entrypoint.sh runs `alembic upgrade head` +
#     scripts/apply_rls.py on the APP ONLY (NEXUS_RUN_MIGRATIONS=1); the worker deliberately
#     does neither, to avoid a migration race. Roll the worker first and it consumes jobs
#     against a stale schema. The Terraform encodes this with depends_on; so does the shared
#     step template both environments use.
#
#  4. THE SMOKE TEST GATES THE RELEASE, and it hits /ready — not /health. Readiness gates on the
#     database being reachable, so a replica that is up but cannot serve is never called good.
#
# Rollback restores the image recorded BEFORE the update, and only when production was actually
# touched. See the Rollback stage.
#
# PRODUCTION CHECKS LIVE IN THE ADO UI, NOT HERE (Pipelines > Environments > production >
# Approvals and checks). YAML cannot declare them.
#
#  - Approvals — the manual gate. Rejecting is SAFE: a rejection fails DeployProduction before any
#    step runs, and Rollback acts only on a deploy that got as far as changing production. An
#    approval that times out marks the stage Skipped instead; Rollback ignores that too.
#
#  - Exclusive lock — RECOMMENDED. Under the default lockBehavior (runLatest; nothing to add here)
#    production deploys are serialized and, when runs contend for production at the same time, the
#    older ones are canceled rather than deployed: approving a stale v1.4.0 while v1.4.1 is queued
#    or deploying cannot roll production backwards. Its limits: it is evaluated AFTER the approval,
#    and it is only documented to arbitrate between runs that contend at the same time — do not
#    count on it to stop an older run approved after a newer one has already FINISHED. Reject stale
#    runs rather than leaving them pending. Put it on the ENVIRONMENT, not as a stage-level
#    lockBehavior: a stage-level runLatest lock only supersedes runs of the same branch, and every
#    release here is a different tag.

name: $(Build.SourceBranchName)-$(Rev:r)

trigger:
  tags:
    include: ["v*"]
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Pipeline variables (Pipelines > Edit > Variables), or an ADO variable group:
  #
  #   AZURE_SUBSCRIPTION          workload-identity-federation service connection name
  #   ACR_NAME                    e.g. nexusgtmprodacr1a2b3c4d  (SHARED by both environments)
  #
  #   RESOURCE_GROUP              nexus-prod-rg
  #   APP_NAME                    nexus-prod-app
  #   WORKER_NAME                 nexus-prod-worker
  #   APP_URL                     https://gtm.infojoy.com
  #
  #   STAGING_RESOURCE_GROUP      nexus-staging-rg
  #   STAGING_APP_NAME            nexus-staging-app
  #   STAGING_WORKER_NAME         nexus-staging-worker
  #   STAGING_APP_URL             https://<staging ACA ingress FQDN>
  #
  # ONE REGISTRY, TWO ENVIRONMENTS, ON PURPOSE. Rule 2 above requires production to run the exact
  # image staging validated. Two registries would mean copying the image between them, and a copy
  # is a new artifact — at which point "the same image was tested" becomes an assumption instead
  # of a fact the `Verify` stage can check.
  - group: gtm-deploy
  - name: IMAGE_REPO
    value: nexus-gtm

stages:
  # ============================================================================
  # Stage 1 — Verify the artifact exists. Cheap, and it turns "deployed nothing"
  # into a clear failure instead of a confusing ACA error ten minutes later.
  # ============================================================================
  - stage: Verify
    displayName: Verify tested image exists
    jobs:
      - job: verify
        displayName: Resolve tag to SHA and confirm image
        timeoutInMinutes: 10
        steps:
          - checkout: self
            fetchDepth: 0 # need the tag's commit

          - bash: |
              set -euo pipefail
              SHA="$(git rev-list -n 1 HEAD)"
              echo "Tag $(Build.SourceBranchName) -> commit ${SHA}"
              echo "##vso[task.setvariable variable=imageSha;isOutput=true]${SHA}"
            name: resolve
            displayName: Resolve tag to commit SHA

          - task: AzureCLI@2
            displayName: Confirm the CI-built, Trivy-scanned image is in ACR
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                SHA="$(resolve.imageSha)"
                if ! az acr repository show-tags \
                      --name "$(ACR_NAME)" --repository "$(IMAGE_REPO)" \
                      --output tsv | grep -qx "${SHA}"; then
                  echo "##[error]No image $(IMAGE_REPO):${SHA} in $(ACR_NAME)."
                  echo "##[error]CI must build and scan this commit on master before it can be tagged and released."
                  echo "##[error]Refusing to build here: a deploy-time build ships an image nothing has scanned."
                  exit 1
                fi
                echo "Found $(IMAGE_REPO):${SHA} — this is the image CI tested."

  # ============================================================================
  # Stage 2 — STAGING. No approval: staging is where the artifact earns the right
  # to be offered to production, so a human gate here would only add latency to a
  # decision nobody can make without the result.
  # ============================================================================
  - stage: DeployStaging
    displayName: Deploy to staging
    dependsOn: Verify
    condition: succeeded()
    variables:
      imageSha: $[ stageDependencies.Verify.verify.outputs['resolve.imageSha'] ]
    jobs:
      - deployment: deploy_staging
        displayName: Roll out app, then worker (staging)
        environment: staging # no required approvers — see the stage comment
        timeoutInMinutes: 45
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/pipelines/deploy-containerapp.yml
                  parameters:
                    envName: staging
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    resourceGroup: $(STAGING_RESOURCE_GROUP)
                    appName: $(STAGING_APP_NAME)
                    workerName: $(STAGING_WORKER_NAME)
                    appUrl: $(STAGING_APP_URL)
                    acrName: $(ACR_NAME)
                    imageRepo: $(IMAGE_REPO)
                    imageSha: $(imageSha)

  # ============================================================================
  # Stage 3 — Validate staging. THE QUALITY GATE. Production is unreachable
  # unless every assertion here passes; each corresponds to a failure this
  # deployment has actually had (docs/deployment/10-ISSUE-LOG.md).
  # ============================================================================
  - stage: ValidateStaging
    displayName: Staging validation gate
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - job: validate
        displayName: Assert staging is genuinely usable
        timeoutInMinutes: 20
        steps:
          - checkout: self
          - template: deploy/pipelines/staging-validation.yml
            parameters:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              resourceGroup: $(STAGING_RESOURCE_GROUP)
              appName: $(STAGING_APP_NAME)
              workerName: $(STAGING_WORKER_NAME)
              appUrl: $(STAGING_APP_URL)

  # ============================================================================
  # Stage 4 — PRODUCTION. `environment: production` is the manual approval gate;
  # configure required approvers (and the Exclusive lock — see the header) in ADO
  # under Pipelines > Environments.
  #
  # The job name `deploy_production` is part of the Rollback stage's output-variable
  # keys. Renaming it silently disables the rollback.
  #
  # dependsOn ValidateStaging, NOT DeployStaging: deploying to staging is not the
  # gate, PASSING there is. Depending on the deploy stage would let a broken
  # artifact reach the approval prompt, where the reviewer has no evidence and
  # the natural action is to approve.
  # ============================================================================
  - stage: DeployProduction
    displayName: Deploy to production
    dependsOn: [Verify, ValidateStaging]
    condition: succeeded()
    variables:
      imageSha: $[ stageDependencies.Verify.verify.outputs['resolve.imageSha'] ]
    jobs:
      - deployment: deploy_production
        displayName: Roll out app, then worker (production)
        environment: production # <-- add required approvers here
        timeoutInMinutes: 45
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/pipelines/deploy-containerapp.yml
                  parameters:
                    envName: production
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    resourceGroup: $(RESOURCE_GROUP)
                    appName: $(APP_NAME)
                    workerName: $(WORKER_NAME)
                    appUrl: $(APP_URL)
                    acrName: $(ACR_NAME)
                    imageRepo: $(IMAGE_REPO)
                    imageSha: $(imageSha)

                - bash: |
                    echo "Deployed $(Build.SourceBranchName) ($(imageSha)) to production."
                    echo "This is the same image digest validated in staging."
                  displayName: Record deployment outcome
                  condition: always()

  # ============================================================================
  # Stage 5 — Automatic rollback if the PRODUCTION deploy failed after it began
  # changing production.
  #
  # Container Apps is in Single revision mode (see deploy/cloud/azure/container_apps.tf), so
  # rollback is a redeploy of the previous IMAGE rather than an instant traffic shift. That is
  # a real limitation and it is why this stage exists rather than a one-line traffic weight.
  #
  # Deliberately NOT wired to a staging failure: a broken staging deploy has harmed nothing, and
  # rolling it back would destroy the evidence needed to diagnose why the artifact was bad. This
  # stage depends on DeployProduction alone, which a staging failure leaves Skipped — never Failed.
  #
  # WHY NOT `condition: failed()`. Rejecting the approval FAILS DeployProduction before a single
  # step runs, so failed() cannot tell "the reviewer said no" from "the deploy broke production" —
  # and a rollback to an older image after a rejection would downgrade a production nothing had
  # touched. So the gate is two facts, both required:
  #   1. DeployProduction's result is Failed. Not Skipped (an approval timeout, or a staging
  #      failure), and not Canceled: a human cancel is never answered with an automatic
  #      production change — hence also not(canceled()).
  #   2. The deploy set `deployStarted`, which the template emits on the line before the app's
  #      `az containerapp update`. Nothing that fails earlier can set it.
  #
  # Output keys of a runOnce deployment job carry the job name as their first segment, and a
  # stage CONDITION adds it once more in front (deploy_production twice below; once in the
  # variables). Both forms: learn.microsoft.com/azure/devops/pipelines/process/expressions
  # #deployment-job-output-variables. A wrong key resolves to empty, which fails SAFE here:
  # no marker, no rollback.
  #
  # The target is the image the deploy RECORDED before it changed anything. Revision history is
  # only the fallback, because in Single revision mode `revision list` without --all returns the
  # one active revision and never an earlier image.
  # ============================================================================
  - stage: Rollback
    displayName: Rollback production on failure
    dependsOn: DeployProduction
    condition: |
      and(
        not(canceled()),
        eq(dependencies.DeployProduction.result, 'Failed'),
        eq(dependencies.DeployProduction.outputs['deploy_production.deploy_production.updateApp.deployStarted'], 'true')
      )
    variables:
      ROLLBACK_PREV_IMAGE: $[ stageDependencies.DeployProduction.deploy_production.outputs['deploy_production.recordPrev.prevImage'] ]
      ROLLBACK_PREV_REVISION: $[ stageDependencies.DeployProduction.deploy_production.outputs['deploy_production.recordPrev.prevRevision'] ]
      ROLLBACK_NEW_IMAGE: $[ stageDependencies.DeployProduction.deploy_production.outputs['deploy_production.updateApp.newImage'] ]
    jobs:
      - job: rollback
        displayName: Restore previous image
        timeoutInMinutes: 30
        steps:
          - task: AzureCLI@2
            displayName: Roll app and worker back
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # The ROLLBACK_* values are read from the ENVIRONMENT, never through ADO macro syntax:
                # a macro whose variable is empty is left in the script as literal text, which bash
                # then runs as a command substitution — in exactly the empty case the fallback below
                # exists for. (No macro spelled out here: ADO expands macros inside comments too.)
                PREV="${ROLLBACK_PREV_IMAGE:-}"
                NEW="${ROLLBACK_NEW_IMAGE:-}"
                [ "${PREV}" != "None" ] || PREV=""
                echo "Failed release: ${NEW:-<unknown>}"
                echo "Recorded before the deploy: revision=${ROLLBACK_PREV_REVISION:-<none>} image=${PREV:-<none>}"

                if [ -z "${PREV}" ]; then
                  if [ -z "${NEW}" ]; then
                    echo "##[error]Neither the previous image nor the failed release's image was recorded, so history cannot be read safely."
                    echo "##[error]MANUAL INTERVENTION REQUIRED. Inspect: az containerapp revision list --all -n $(APP_NAME) -g $(RESOURCE_GROUP) -o table"
                    exit 1
                  fi
                  echo "##[warning]No rollback target was recorded; reconstructing it from revision history."
                  # --all includes INACTIVE revisions — in Single revision mode, every earlier one.
                  # Newest revision that is not the failed release and not known-unhealthy. By
                  # exclusion rather than by position: whether the failed release created a revision
                  # at all depends on how far it got, so "[-2]" can land one release too far back.
                  PREV=$(az containerapp revision list --all \
                    --name "$(APP_NAME)" --resource-group "$(RESOURCE_GROUP)" \
                    --query "sort_by([?properties.template.containers[0].image!='${NEW}' && properties.healthState!='Unhealthy'], &properties.createdTime)[-1].properties.template.containers[0].image" \
                    -o tsv)
                  [ "${PREV}" != "None" ] || PREV=""
                fi

                if [ -z "${PREV}" ]; then
                  echo "##[error]No earlier image found in revision history. MANUAL INTERVENTION REQUIRED."
                  echo "##[error]Inspect: az containerapp revision list --all -n $(APP_NAME) -g $(RESOURCE_GROUP) -o table"
                  exit 1
                fi
                if [ "${PREV}" = "${NEW}" ]; then
                  # Production already ran this image before the deploy began (a re-run of a live
                  # tag, or a retry after a rollback that itself failed). "Rolling back" to it would
                  # change nothing and report success.
                  echo "##[error]Production was already running ${NEW} before this deploy; this run has no earlier state to restore."
                  echo "##[error]MANUAL INTERVENTION REQUIRED. Inspect: az containerapp revision list --all -n $(APP_NAME) -g $(RESOURCE_GROUP) -o table"
                  exit 1
                fi
                echo "Rolling back to ${PREV}"
                az containerapp update -n "$(APP_NAME)"    -g "$(RESOURCE_GROUP)" --image "${PREV}" --output none
                az containerapp update -n "$(WORKER_NAME)" -g "$(RESOURCE_GROUP)" --image "${PREV}" --output none
                echo "##[warning]Rolled back to ${PREV}. The failed release was NOT deployed."
                echo "##[warning]NOTE: a rollback does NOT revert database migrations. The schema stays"
                echo "##[warning]compatible (migrations are additive-only), but if the failed release APPLIED a"
                echo "##[warning]migration, this older image's boot-time 'alembic upgrade head' does not know that"
                echo "##[warning]revision (scripts/bootstrap_db.py fails on it) and the app may not start. Verify:"
                echo "##[warning]  az containerapp revision list -n $(APP_NAME) -g $(RESOURCE_GROUP) -o table"
