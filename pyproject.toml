[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-gtm"
version = "0.1.0"
description = "NEXUS GTM — AI-powered Go-To-Market intelligence platform (multi-tenant SaaS)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "email-validator>=2.0",
    "aiosqlite>=0.19",          # local/test database driver
]

[project.optional-dependencies]
# Production / optional adapters — core runs without any of these.
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
scraping = ["scrapling>=0.4"]   # enables the Scrapling browser/enrichment adapter
metrics = ["prometheus-fastapi-instrumentator>=7.0"]
migrate = ["alembic>=1.13"]     # schema migrations for production databases
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "fakeredis>=2.20"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
