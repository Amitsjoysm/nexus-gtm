[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-gtm"
version = "0.1.0"
description = "NEXUS GTM — AI-powered Go-To-Market intelligence platform (multi-tenant SaaS)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<0.116",   # pin: 0.116+ router objects break prometheus-instrumentator<8 introspection
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.2,<4.1",         # passlib 1.7 breaks on bcrypt>=4.1 (__about__ removed)
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "email-validator>=2.0",
    "dnspython>=2.6",           # DNS/MX email verification (free, no-infra deliverability check)
    "aiosqlite>=0.19",          # local/test database driver
]

[project.optional-dependencies]
# Production / optional adapters — core runs without any of these.
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
scraping = ["scrapling>=0.4"]   # enables the Scrapling browser/enrichment adapter
metrics = ["prometheus-fastapi-instrumentator>=7.0,<8"]   # 8.x mismatches FastAPI<0.116 route resolution
migrate = ["alembic>=1.13"]     # schema migrations for production databases
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "fakeredis>=2.20", "pytest-xdist>=3.5", "pytest-timeout>=2.3", "ruff>=0.5", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["nexus*"]

# ---- Lint gate (ruff). Scoped to high-signal rules so it's a real CI gate, not noise. ----
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# F = pyflakes (unused imports, undefined names, f-string bugs); E9 = syntax/IO errors.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Tests sometimes call for side effects and bind the result for readability.
"tests/**" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Put the repo root on sys.path for every invocation. Test modules import each other's helpers as
# `from tests.conftest import ...`, and `tests` is a plain directory, not an installed package.
#
# Without this the suite passes locally and fails in CI, which is exactly what happened: `python -m
# pytest` prepends the working directory to sys.path, so `tests` resolves; CI runs bare `pytest`,
# which does not, so 111 modules died on `ModuleNotFoundError: No module named 'tests'` while the
# same tests were green on every developer's machine. Setting it here (rather than exporting
# PYTHONPATH in the workflow) keeps the two invocations honest about the same thing.
pythonpath = ["."]
# Safety net (pytest-timeout): a test that accidentally blocks — e.g. a real network call that
# slips past the offline stubs — is killed at 120s with a traceback and reported as a failure,
# instead of hanging the whole run forever. Thread method is required on Windows (no SIGALRM).
timeout = 120
timeout_method = "thread"
# Parallel by default (pytest-xdist). The suite is ~1350 tests and `fresh_db` drops and recreates
# every table before each one, so the run is dominated by per-test schema work that parallelises
# almost perfectly. `conftest.py` already gives each worker its own SQLite file via
# PYTEST_XDIST_WORKER, which is what makes this safe — without that, one worker's drop_all would
# wipe another's tables mid-test.
#
# `--dist loadfile` keeps every test in a file on the same worker. Several suites share
# module-level state (the ingestion service, the agent runtime, seeded catalogs), and splitting a
# file across workers turns that into flaky cross-talk that only reproduces under -n.
#
# Override with `-p no:xdist` or `-n0` when debugging: tracebacks are easier to read serially.
addopts = "-n auto --dist loadfile"
