# gitleaks configuration.
#
# `useDefault = true` keeps every upstream rule; this file only ADDS exceptions, so a genuine
# credential still fails the build.
#
# EXCEPTIONS ARE LISTED BY LITERAL VALUE, NOT BY PATH. Allowlisting `tests/**` or `docs/**`
# wholesale would be easier and is exactly wrong: a real key pasted into a fixture is one of the
# likelier ways a credential reaches this repository, and a path allowlist would hide exactly
# that. Each entry is a specific fake string somebody chose deliberately, so a new finding is
# always a new decision rather than something this config silently swallowed.
#
# regexTarget = "line" is REQUIRED. By default gitleaks matches these patterns against the
# CAPTURED SECRET VALUE, so a pattern naming a FIELD can never match - the field name is not
# part of the value. Matching the whole line makes the Terraform field-name case and the
# literal-fixture case both work.
#
# NO COMMENTS INSIDE THE ARRAY. The gitleaks TOML parser rejects them with a misleading
# "unterminated array" pointing at the closing bracket. Keeping the array to bare literals
# avoids the question entirely.
#
# The allowlisted findings, reviewed 2026-08-31. None is a live credential:
#
#   password_secret_name =   deploy/cloud/azure/container_apps.tf (x2). The NAME of an Azure
#                            Container Apps secret. Its value is local.acr.admin_password, a
#                            Terraform reference that never appears as a literal anywhere.
#   isolation-test-pw-123    docs/deployment/04-ENDPOINT-TESTS.md - a curl example
#   cust-dir-probe-1         tests/test_admin_customers.py - a lookup key, not a credential
#   sk-test-abcdefgh1234     tests/test_provider_keys.py and the plan doc quoting it
#   s3cr3t-pw-9f2a1c         tests/test_source_databases.py - fixture DSN password

[extend]
useDefault = true

[allowlist]
description = "Verified false positives, reviewed 2026-08-31. None is a live credential."
regexTarget = "line"
regexes = [
  'password_secret_name\s*=',
  'isolation-test-pw-123',
  'cust-dir-probe-1',
  'sk-test-abcdefgh1234',
  's3cr3t-pw-9f2a1c',
]
