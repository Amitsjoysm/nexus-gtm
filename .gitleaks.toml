# gitleaks configuration.
#
# `useDefault = true` keeps every upstream rule — this file only ADDS exceptions, so a genuine
# credential still fails the build.
#
# EXCEPTIONS ARE LISTED BY LITERAL VALUE, NOT BY PATH. Allowlisting `tests/**` or `docs/**`
# wholesale would be easier and is exactly wrong: a real key pasted into a fixture is one of the
# likelier ways a credential reaches this repository, and a path allowlist would make that
# invisible. Each entry below is a specific fake string somebody chose deliberately, so a new
# finding is always a new decision rather than something the config silently swallowed.
[extend]
useDefault = true

[allowlist]
description = "Verified false positives, reviewed 2026-08-31. None is a live credential."

# MATCH AGAINST THE WHOLE LINE, NOT THE CAPTURED SECRET.
#
# This is the default that caught me out. With no regexTarget, gitleaks tests these patterns
# against the SECRET VALUE it extracted — so a pattern naming a FIELD (`password_secret_name =`)
# can never match, because the field name is not part of the value. The five literal fixtures
# below matched anyway, since there the literal IS the secret; the two Terraform findings did
# not. "line" makes both kinds work.
regexTarget = "line"

regexes = [
  # ---- Azure Container Apps: a secret's NAME, not its value ----------------------------
  # container_apps.tf sets `password_secret_name = "acr-password"`, pointing the registry block
  # at a secret whose value is `local.acr.admin_password` — a Terraform reference, never a
  # literal. gitleaks' hashicorp-tf-password rule matches any `*password* =` assignment in a
  # .tf file and cannot distinguish a name from a value.
  '''password_secret_name\s*=''',

  # ---- Deterministic test fixtures and documentation examples --------------------------
  # Made-up constants, chosen to be obviously fake. They are load-bearing for the tests that
  # assert on them, so they cannot simply be deleted.
  '''isolation-test-pw-123''',   # docs/deployment/04-ENDPOINT-TESTS.md — curl example
  '''cust-dir-probe-1''',        # tests/test_admin_customers.py — a lookup key, not a secret
  '''sk-test-abcdefgh1234''',    # tests/test_provider_keys.py + the plan doc quoting it
  '''s3cr3t-pw-9f2a1c''',        # tests/test_source_databases.py — fixture DSN password
