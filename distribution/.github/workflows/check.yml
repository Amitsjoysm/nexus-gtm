name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every listing (offline)
        run: python3 scripts/check.py
      - name: Build the upload packages
        run: python3 scripts/build.py
